name: Build & Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .NET Framework 4.8 compiler
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /? | Select-Object -First 3

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Test
        shell: pwsh
        run: ./test.ps1

      - name: Package
        shell: pwsh
        run: ./package.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $src = Get-Content -LiteralPath 'src\Models.cs' -Raw
          if ($src -match 'const string Version = "([0-9.]+)"') {
            "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else { throw 'Version not found' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WutheringWavesSteamBridge-${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/WutheringWavesSteamBridge.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WutheringWavesSteamBridge-${{ steps.version.outputs.version }}-packages
          path: |
            dist/WutheringWavesSteamBridge-${{ steps.version.outputs.version }}-win-x64.zip
            dist/WutheringWavesSteamBridge-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WutheringWavesSteamBridge-${{ steps.version.outputs.version }}-win-x64.zip
            dist/WutheringWavesSteamBridge-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
